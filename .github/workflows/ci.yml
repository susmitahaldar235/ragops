name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' build
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m zipfile --list dist/ragops-*.whl | grep 'ragops/web/index.html'
          python -m zipfile --list dist/ragops-*.whl | grep 'ragops/api/main.py'
      - name: Run credential-free release gate
        run: |
          ragops demo --profile engineer --output demo-output
          ragops evidence verify --bundle demo-output/evidence

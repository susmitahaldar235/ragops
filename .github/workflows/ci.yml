name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]' build
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m zipfile --list dist/ragops-*.whl | grep 'ragops/web/index.html'
          python -m zipfile --list dist/ragops-*.whl | grep 'ragops/api/main.py'
      - name: Run credential-free release gate
        run: |
          ragops demo --profile engineer --output demo-output
          ragops evidence verify --bundle demo-output/evidence

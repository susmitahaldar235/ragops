ragops_release_gate:
  stage: test
  image: python:3.12-slim
  variables:
    RAGOPS_VERSION: "1.2.0"
    RAGOPS_SCENARIO: "scenarios/japanese_troubleshooting/benchmark-v0.2.json"
    RAGOPS_BASELINE: "scenarios/japanese_troubleshooting/benchmark-baseline.json"
    RAGOPS_CANDIDATE: "scenarios/japanese_troubleshooting/benchmark-regressed.json"
    RAGOPS_POLICY: ""
  before_script:
    - python -m pip install --disable-pip-version-check "ragops==$RAGOPS_VERSION"
  script:
    - |
      set +e
      if [ -n "$RAGOPS_POLICY" ]; then
        ragops compare \
          --scenario "$RAGOPS_SCENARIO" \
          --baseline "$RAGOPS_BASELINE" \
          --candidate "$RAGOPS_CANDIDATE" \
          --policy "$RAGOPS_POLICY" \
          --format markdown \
          --output ragops-report.md >ragops-command.log 2>&1
      else
        ragops compare \
          --scenario "$RAGOPS_SCENARIO" \
          --baseline "$RAGOPS_BASELINE" \
          --candidate "$RAGOPS_CANDIDATE" \
          --format markdown \
          --output ragops-report.md >ragops-command.log 2>&1
      fi
      gate_exit=$?
      set -e
      if [ ! -f ragops-report.md ]; then
        {
          echo "# RAGOps release gate error"
          echo
          echo '```text'
          cat ragops-command.log
          echo '```'
        } >ragops-report.md
      fi
      decision=PASS
      if [ "$gate_exit" -ne 0 ]; then decision=BLOCK; fi
      ragops evidence create \
        --bundle ragops-evidence \
        --decision "$decision" \
        --artifact report=ragops-report.md \
        --artifact command_log=ragops-command.log \
        --limitation "Consumer-provided recorded benchmark; production representativeness is not inferred"
      ragops evidence verify --bundle ragops-evidence
      cat ragops-report.md
      exit "$gate_exit"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ragops-report.md
      - ragops-command.log
      - ragops-evidence/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

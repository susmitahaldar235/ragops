name: RAGOps

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ragops==2.0.0"
      - name: Evaluate release candidate
        run: ragops demo --profile engineer --output ragops-output
      - name: Verify evidence bundle
        run: ragops evidence verify --bundle ragops-output/evidence
      - name: Write bounded summary
        run: cat ragops-output/github-summary.md >> "$GITHUB_STEP_SUMMARY"

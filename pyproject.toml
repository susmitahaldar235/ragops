[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ragops"
version = "2.0.1"
description = "Regression tests and explainable release gates for RAG and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thang Luu" }]
keywords = ["rag", "evaluation", "ai-agents", "release-gates", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thangldw/ragops"
Documentation = "https://github.com/thangldw/ragops#readme"
Issues = "https://github.com/thangldw/ragops/issues"
Changelog = "https://github.com/thangldw/ragops/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6", "fastapi>=0.115", "jsonschema>=4.23"]
release = ["build>=1.2", "cyclonedx-bom>=7.3", "twine>=5.1"]

[project.scripts]
ragops = "ragops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragops"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "ragops/schemas"
"src/ragops/web/index.html" = "ragops/web/index.html"
"src/ragops/web/app.js" = "ragops/web/app.js"
"src/ragops/web/styles.css" = "ragops/web/styles.css"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:pytest_playwright"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
